# Verified native-raster baseline.
rtx.dlfg.enable = False
rtx.defaultToAdvancedUI = True
rtx.enableReplacementAssets = False
rtx.graphicsPreset = 0
rtx.volumetrics.enable = False
rtx.upscalerType = 1
rtx.enableRaytracing = False
rtx.enableRayReconstruction = False
rtx.qualityDLSS = 5
rtx.forceCameraJitter = False
rtx.rasterDlss.enableRasterDlss = True
rtx.integrateIndirectMode = 0

# Neural Rendering is opt-in and requires a separately obtained compatible
# runtime and ReShade add-on. The source repository does not provide either.
rtx.neuralRendering.enableNeuralRendering = False
rtx.neuralRendering.neuralRenderingPreset = 1
rtx.neuralRendering.neuralRenderingStyle = 1
rtx.neuralRendering.neuralRenderingIntensity = 1.0
rtx.neuralRendering.neuralRenderingLocalToneStrength = 1.0
rtx.neuralRendering.neuralRenderingLocalStructureStrength = 1.0
rtx.neuralRendering.neuralRenderingSkinStructureStrength = -1.0
rtx.neuralRendering.neuralRenderingAutoMask = True
rtx.neuralRendering.neuralRenderingUICorrection = False
rtx.neuralRendering.neuralRenderingDepthMode = 0
rtx.neuralRendering.neuralRenderingMotionScaleX = 1.0
rtx.neuralRendering.neuralRenderingMotionScaleY = 1.0
